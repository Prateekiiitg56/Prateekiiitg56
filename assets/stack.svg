<title id="t">Tech stack</title>
<desc id="d">Tech stack. languages: Python, Java, JavaScript, TypeScript, C++, SQL. frameworks: React, Next.js, Node.js, Express, Streamlit. databases: MySQL, MongoDB, Firebase, IndexedDB. ai / ml: TensorFlow, Scikit-Learn, Pandas, OpenCV, OpenVINO. tools: Git, Linux, VS Code, Postman, Tailwind CSS.</desc>
